{% extends "auth/base.html" %}
{% block title %}Create account{% endblock %}
{% block body_class %}auth-entry{% endblock %}
{% block content %}
<section class="card auth-card">
  <h2 class="auth-title">Create account</h2>
  <p class="auth-sub">New accounts start on the free <b>Basic</b> plan (crowd + water quality).</p>
  <form method="post" action="{{ url_for('auth.register') }}" class="auth-form">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Name
      <input type="text" name="name" value="{{ form.name }}" autocomplete="name" required autofocus>
    </label>
    <label>Email
      <input type="email" name="email" value="{{ form.email }}" autocomplete="email" required>
    </label>
    <label>Password <span class="hint">(at least 8 characters)</span>
      <input type="password" name="password" autocomplete="new-password" minlength="8" required>
    </label>
    <label>Confirm password
      <input type="password" name="confirm" autocomplete="new-password" minlength="8" required>
    </label>
    <button type="submit" class="btn btn-primary auth-submit">Create account</button>
  </form>
  <p class="auth-switch">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p>
</section>
{% endblock %}
